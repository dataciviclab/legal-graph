# CI — legal-graph
#
# I mart non sono più in git. I test:
# 1) se c'è out/ locale (dev) → usano quello
# 2) altrimenti scaricano le 6 tabelle grafo da GCS (httpfs DuckDB)
# texts/massime: se assenti, i test che li usano skippano (comportamento già soft)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: legal-graph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline,mcp"

      - name: Preflight dataset.yml
        run: make check

      - name: Ensure mart (locale o GCS)
        run: |
          set -euo pipefail
          DIR="out/data/mart/legal_graph/2026"
          YEAR=2026
          if [ -f "$DIR/mart_legal_nodes.parquet" ]; then
            echo "Mart locale presenti — ok"
            exit 0
          fi
          echo "Mart assenti — download grafo da GCS (no texts/massime)"
          mkdir -p "$DIR"
          BASE="https://storage.googleapis.com/dataciviclab-mart/legal-graph/legal_graph/${YEAR}"
          for t in mart_legal_nodes mart_legal_edges mart_legal_node_metrics \
                   mart_legal_search_keys mart_legal_node_rel mart_legal_emend_leg; do
            curl -fsSL "$BASE/${t}.parquet" -o "$DIR/${t}.parquet"
            echo "✅ $t"
          done

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "legal_graph tests scripts"
          test_dir: "tests"
          pytest_args: "-q"
