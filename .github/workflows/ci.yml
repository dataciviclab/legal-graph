# CI — legal-graph
#
# Check leggero su PR/push: preflight config + lint + test.
# Il run completo del compose (nodi/archi da rete) avviene in pipeline.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: legal-graph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline,mcp"

      - name: Preflight dataset.yml
        run: make check

      - name: Build compose (fonti da rete)
        run: make run

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "legal_graph tests scripts"
          test_dir: "tests"
          pytest_args: "-q"
