# CI — legal-graph
#
# Su PR/push: solo preflight config + lint. I test sul mart girano in
# pipeline.yml (dopo make run) o localmente — il mart non è più in git.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: legal-graph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev"

      - name: Preflight dataset.yml
        run: make check

      - name: Lint
        run: make lint
