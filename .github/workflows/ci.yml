# CI — legal-graph
#
# Su PR/push: solo preflight config + lint. I test sul mart girano in
# pipeline.yml (dopo make run) o localmente — il mart non è più in git.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: legal-graph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline"

      - name: Preflight compose configs
        run: make check

      - name: Lint
        run: make lint

      # Test unit: logica MCP, URN, guard, path. Zero byte da GCS.
      # I test che asseriscono il mart (marker `mart`) girano nella pipeline,
      # dopo `make run`, dove il mart esiste: qui non servirebbe scaricarlo.
      - name: Tests (unit, senza mart)
        # SOURCE=local: senza mart locale `resolve()` non ripiega su GCS.
        # Senza questo, un test che tocca il mart in un checkout pulito
        # scaricherebbe i parquet dal bucket invece di skippare.
        env:
          LEGAL_GRAPH_SOURCE: local
        run: python -m pytest -q -m "not mart and not network"

  # Cambi ai workflow: actionlint + pattern pericolosi, senza build.
  # Sostituisce il trigger di pipeline.yml su se stesso (525 MB per modifica).
  lint-workflows:
    uses: dataciviclab/.github/.github/workflows/lint-workflows-reusable.yml@main
