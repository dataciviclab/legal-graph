# CI — legal-graph
#
# Check leggero su PR/push: preflight config + lint + test.
# Il build del compose (make run da rete) avviene SOLO in pipeline.yml,
# che committa i mart in repo. I test girano sul mart già presente.
#
# Se il mart manca (clone senza out/data/mart), fallback make run.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: legal-graph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline,mcp"

      - name: Preflight dataset.yml
        run: make check

      - name: Ensure mart exists (fallback build)
        run: |
          if [ ! -f "out/data/mart/legal_graph/${YEAR:-2026}/mart_legal_nodes.parquet" ]; then
            echo "Mart assente — build locale (fallback CI)"
            make run
          else
            echo "Mart già nel repo (commit Pipeline) — skip make run"
          fi

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "legal_graph tests scripts"
          test_dir: "tests"
          pytest_args: "-q"
