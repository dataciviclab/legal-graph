# Pipeline — legal-graph
#
# Compose mart-only: build da rete → test → sync GCS (6 tabelle grafo) → registry.
# I mart NON vanno più in git: source of truth = gs://dataciviclab-mart/legal-graph/
# texts/massime restano locali/MCP-only nel primo rilascio (no GCS).
#
# Trigger: lunedì 06:00 UTC · dispatch · push main su dataset.yml|sql/**

name: Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "dataset.yml"
      - "sql/**"
  workflow_dispatch:

concurrency:
  group: legal-graph-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline,mcp"

      - name: Build compose (tutti i mart locali)
        run: make run

      - name: Intelligence (metriche se mancanti)
        run: make intelligence

      - name: Verify tests su mart costruiti
        run: make test

      # ── GCS: solo tabelle grafo (no texts/massime) ─────────────────
      - name: GCP Auth (WIF)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # setup-gcloud obbligatorio: il gsutil del runner non supporta le
      # credenziali WIF external_account (401 Anonymous caller). Stesso
      # pattern di italia-corpus/build-dataset.yml.
      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync grafo to GCS (no texts/massime)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          SRC="out/data/mart/legal_graph/2026"
          DEST="gs://dataciviclab-mart/legal-graph/legal_graph/2026"
          TABLES="mart_legal_nodes mart_legal_edges mart_legal_node_metrics mart_legal_search_keys mart_legal_node_rel mart_legal_emend_leg"
          for t in $TABLES; do
            f="$SRC/${t}.parquet"
            if [ ! -f "$f" ]; then
              echo "::error::manca $f"
              exit 1
            fi
            gsutil -q cp "$f" "$DEST/${t}.parquet"
            echo "✅ $t"
          done
          # metadata leggero del compose (senza testi)
          if [ -f "$SRC/metadata.json" ]; then
            gsutil -q cp "$SRC/metadata.json" "$DEST/metadata.json"
          fi
          echo "✅ GCS $DEST"

      - name: Upload artifact (tutti i mart, 14gg)
        uses: actions/upload-artifact@v7
        with:
          name: legal-graph-mart
          path: out/data/mart/legal_graph/
          retention-days: 14

      # Registry update PR rimosso (2026-10-08): toolkit registry build
      # richiede sezioni {slug}/dataset.yml — incompatibile col layout
      # compose monorepo con dataset.yml alla root. Da ripristinare con
      # supporto toolkit per root-level dataset.yml.
