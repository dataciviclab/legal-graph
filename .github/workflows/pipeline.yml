# Pipeline — legal-graph
#
# Compose mart-only: build da rete → test → sync GCS (12 tabelle mart) → registry.
# I mart NON vanno più in git: source of truth = gs://dataciviclab-mart/legal-graph/
# texts/massime/edges_in sono nel publish: attivi per i client dal primo run
# di pipeline che li carica (prima l'MCP degrada su GitHub raw / `edges`).
#
# Trigger: lunedì 06:00 UTC · dispatch · push main su dataset.yml|sql/**|
# legal_graph/**|tests/**.
#
# Perché anche il codice: la CI su PR fa solo preflight+lint, i test sul mart
# girano qui. Senza `legal_graph/**` un fix di search/views arriverebbe su main
# senza test e senza ripubblicare i mart (l'MCP legge GCS).

name: Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "dataset.yml"
      - "sql/**"
      - "legal_graph/**"
      - "tests/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

concurrency:
  group: legal-graph-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      # i test girano subito dopo `make run`: un mart mancante deve fallire la
      # pipeline, non skippare in silenzio
      LEGAL_GRAPH_REQUIRE_MART: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline,mcp"

      - name: Build compose (tutti i mart locali)
        run: make run

      - name: Verify tests su mart costruiti
        run: make test

      # `addopts` in pyproject esclude i test `network` (fetch da GitHub raw):
      # nel loop locale la cache testo è fredda e la rete non è un presupposto.
      # Qui i mart sono già stati costruiti dalla rete, quindi girano anche loro.
      - name: Verify test di rete (testo da GitHub raw)
        run: python3 -m pytest tests/ -m network -q

      # ── GCS: tutte le 12 tabelle mart (grafo + alias/vocabolario + texts) ─
      - name: GCP Auth (WIF)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # setup-gcloud obbligatorio: il gsutil del runner non supporta le
      # credenziali WIF external_account (401 Anonymous caller). Stesso
      # pattern di italia-corpus/build-dataset.yml.
      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync mart to GCS (12 tabelle)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          SRC="out/data/mart/legal_graph/2026"
          DEST="gs://dataciviclab-mart/legal-graph/legal_graph/2026"
          TABLES="mart_legal_nodes mart_legal_edges mart_legal_entity_alias mart_legal_relation_type mart_legal_edges_in mart_legal_coverage mart_legal_node_metrics mart_legal_search_keys mart_legal_node_rel mart_legal_emend_leg mart_legal_texts mart_legal_massime"
          for t in $TABLES; do
            f="$SRC/${t}.parquet"
            if [ ! -f "$f" ]; then
              echo "::error::manca $f"
              exit 1
            fi
            gsutil -q cp "$f" "$DEST/${t}.parquet"
            echo "✅ $t"
          done
          # metadata del compose (righe/schema, non i dati)
          if [ -f "$SRC/metadata.json" ]; then
            gsutil -q cp "$SRC/metadata.json" "$DEST/metadata.json"
          fi
          echo "✅ GCS $DEST"

      - name: Upload artifact (tutti i mart, 14gg)
        uses: actions/upload-artifact@v7
        with:
          name: legal-graph-mart
          path: out/data/mart/legal_graph/
          retention-days: 14

      # Registry update PR rimosso (2026-10-08): toolkit registry build
      # richiede sezioni {slug}/dataset.yml — incompatibile col layout
      # compose monorepo con dataset.yml alla root. Da ripristinare con
      # supporto toolkit per root-level dataset.yml.
