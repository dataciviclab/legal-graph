# Pipeline — legal-graph
#
# Compose mart-only in due dataset sotto `compose/`:
# - legal-graph  → 12 tabelle (nodi, archi, indici, testi, massime)
# - legal-index  → 1 tabella (indice BM25, picco di memoria isolato)
# I mart NON vanno in git: source of truth = gs://dataciviclab-mart/legal-graph/
#
# Trigger: lunedì 06:00 UTC · dispatch · push main su compose/**|
# legal_graph/**. I cambi ai soli test non hanno un workflow dedicato:
# li valida il primo run successivo della pipeline (o un `workflow_dispatch`).
#
# Perché anche il codice: la CI su PR fa solo preflight+lint, i test sul mart
# girano qui. Senza `legal_graph/**` un fix di search/views arriverebbe su main
# senza test e senza ripubblicare i mart (l'MCP legge GCS).

name: Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "compose/**"
      - "legal_graph/**"
      # I cambi al workflow NON stanno qui: un run completo rifà il build.
      # Li valida `ci.yml` (preflight + lint, actionlint via reusable org).
  workflow_dispatch:

concurrency:
  group: legal-graph-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      # i test girano subito dopo `make run`: un mart mancante deve fallire la
      # pipeline, non skippare in silenzio
      LEGAL_GRAPH_REQUIRE_MART: "1"
      # indice BM25: ~62M token in aggregazione, il default 2GB non basta
      DUCKDB_MEMORY_LIMIT: "4GB"
      DUCKDB_PRESERVE_INSERTION_ORDER: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline,mcp"

      - name: Build compose (tutti i mart locali)
        run: make run

      - name: Verify tests su mart costruiti
        run: make test

      # `addopts` in pyproject esclude i test `network` (fetch da GitHub raw):
      # nel loop locale la cache testo è fredda e la rete non è un presupposto.
      # Qui i mart sono già stati costruiti dalla rete, quindi girano anche loro.
      - name: Verify test di rete (testo da GitHub raw)
        run: python3 -m pytest tests/ -m network -q

      # ── GCS: tutte le 12 tabelle mart (grafo + alias/vocabolario + texts) ─
      - name: GCP Auth (WIF)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # setup-gcloud obbligatorio: il gsutil del runner non supporta le
      # credenziali WIF external_account (401 Anonymous caller). Stesso
      # pattern di italia-corpus/build-dataset.yml.
      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync mart to GCS (grafo, 13 tabelle)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          SRC="out/data/mart/legal_graph/2026"
          DEST="gs://dataciviclab-mart/legal-graph/legal_graph/2026"
          TABLES="mart_legal_nodes mart_legal_edges mart_legal_entity_alias mart_legal_relation_type mart_legal_edges_in mart_legal_coverage mart_legal_node_metrics mart_legal_search_keys mart_legal_node_rel mart_legal_emend_leg mart_legal_texts mart_legal_massime mart_legal_freshness"
          for t in $TABLES; do
            f="$SRC/${t}.parquet"
            if [ ! -f "$f" ]; then
              echo "::error::manca $f"
              exit 1
            fi
            gsutil -q cp "$f" "$DEST/${t}.parquet"
            echo "✅ $t"
          done
          # metadata del compose (righe/schema, non i dati)
          if [ -f "$SRC/metadata.json" ]; then
            gsutil -q cp "$SRC/metadata.json" "$DEST/metadata.json"
          fi
          echo "✅ GCS $DEST"

      # Dataset fratello: stesso prefix `legal-graph/`, slug `legal_index`.
      # Il path pubblico cambia solo per search_terms (vedi paths.py).
      - name: Sync indice to GCS (legal_index, 1 tabella)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          SRC="out/data/mart/legal_index/2026"
          DEST="gs://dataciviclab-mart/legal-graph/legal_index/2026"
          f="$SRC/mart_legal_search_terms.parquet"
          if [ ! -f "$f" ]; then
            echo "::error::manca $f"
            exit 1
          fi
          gsutil -q cp "$f" "$DEST/mart_legal_search_terms.parquet"
          echo "✅ mart_legal_search_terms"
          if [ -f "$SRC/metadata.json" ]; then
            gsutil -q cp "$SRC/metadata.json" "$DEST/metadata.json"
          fi
          echo "✅ GCS $DEST"

      - name: Upload artifact (tutti i mart, 14gg)
        uses: actions/upload-artifact@v7
        with:
          name: legal-graph-mart
          path: |
            out/data/mart/legal_graph/
            out/data/mart/legal_index/
          retention-days: 14

      # ── Registry (artifact catalogo) → draft PR ─────────────────────
      # Ripristinato col layout `compose/{slug}/dataset.yml`: il builder del
      # registry scopre le sezioni per convenzione, un dataset.yml in root
      # non esisteva per lui (per questo `legal_graph` mancava dal catalogo).
      - name: Registry update PR
        if: ${{ !cancelled() && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: dataciviclab/.github/actions/registry-update-pr@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
