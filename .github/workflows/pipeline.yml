# Pipeline — legal-graph
#
# Compose mart-only in tre dataset sotto `compose/`:
# - legal-graph  → 10 tabelle (nodi, archi, metriche, chiavi) + freshness
# - legal-texts  → 2 tabelle (testi, massime; payload e memoria isolati)
# - legal-index  → 1 tabella (indice BM25, picco di memoria isolato)
# I mart NON vanno in git: source of truth = gs://dataciviclab-mart/legal-graph/
#
# Workflow reusable org (come `pil-intelligence`, compose-only): build →
# verify → sync → registry. `detect-paths: compose` + `make run-batch`
# eseguono solo i dataset cambiati; schedule e dispatch restano completi.
#
# Sync `per-dataset` (flat fallirebbe: non c'è out/data/clean). Nota: la
# reusable sincronizza l'intera directory anno, quindi carica anche `_run/`
# e le tabelle `internal` (stg_*). Accettato finché non esiste `sync-exclude`
# nella reusable.
#
# I cambi al solo codice MCP (`legal_graph/**`, `tests/**`) sono coperti da
# `code-tests.yml`: scarica i mart pubblicati e lancia i test, senza rebuild
# né publish. Prima del 2026-11 `legal_graph/**` era nei trigger di questa
# pipeline (run completo, ~0,5 GiB per un fix di codice).

name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "compose/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: legal-graph-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "legal-graph"
      run-command: "make run"
      # I test girano anche sul batch: `run-batch` chiama `ensure-marts` e
      # scarica i dataset non ricostruiti, così il set è completo.
      verify-command: "make test && python3 -m pytest tests/ -m network -q"
      sync-pattern: "per-dataset"
      detect-paths: "compose"
      install-extras: "dev,pipeline,mcp"
      extra-env: |
        LEGAL_GRAPH_REQUIRE_MART=1
        DUCKDB_MEMORY_LIMIT=4GB
        DUCKDB_PRESERVE_INSERTION_ORDER=false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
