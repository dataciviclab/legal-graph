[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-graph"
version = "0.1.0"
description = "Legal Knowledge Graph — 25.000+ atti normativi, 500.000+ relazioni"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "lab-connectors[mcp] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
legal-graph-mcp = "legal_graph.mcp_server:main"

[tool.setuptools.packages.find]
include = ["legal_graph*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
