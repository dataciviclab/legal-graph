# legal-graph — compose mart-only del Legal Knowledge Graph
#
# Modello pil-intelligence: nessun raw/clean propri. I SQL leggono i
# parquet upstream **direttamente da rete** (GCS HTTPS / GitHub raw)
# via support type: external — senza materializzarli in locale.
#
# Forma dichiarativa (toolkit PR dataciviclab/toolkit#497):
#   repo+slug+layer → path risolto dal registry del produttore
#   repo+path       → raw.githubusercontent.com (derived non nel registry)
#
# Output: out/data/mart/legal_graph/2026/
#   - mart_legal_nodes.parquet
#   - mart_legal_edges.parquet

root: "out"
schema_version: 1

dataset:
  name: "legal_graph"
  source_id: "dataciviclab_composite"
  tags: [diritto, normativa, legal-graph, compose, knowledge-graph]
  category: normativa
  description: >
    Legal Knowledge Graph: nodi unici e relazioni legislative/materiali
    unificati da italia-corpus, costituzione-italiana, gu-monitor,
    senato-akn e open-politica. Fonti lette da rete (GCS/GitHub).
  years: [2026]
  time_coverage:
    start_year: 1874
    end_year: 2026

# Nessuna sezione raw/clean: mart-only compose.

support:
  # -- italia-corpus (clean GCS -- layer toolkit IC) ----------------
  # citazioni/pnrr/abrogations: ancora derived GitHub (wave 2 IC)
  - name: normativa
    type: external
    repo: italia-corpus
    slug: normativa
    layer: clean
    years: [2026]
  - name: riferimenti
    type: external
    repo: italia-corpus
    slug: riferimenti
    layer: clean
    years: [2026]
  - name: citazioni_costituzionali
    type: external
    repo: italia-corpus
    path: data/derived/citazioni-costituzionali.parquet
  - name: pnrr_references
    type: external
    repo: italia-corpus
    path: data/derived/pnrr_references.parquet
  - name: abrogations_raw
    type: external
    repo: italia-corpus
    path: data/derived/abrogations_raw.parquet

  # -- gu-monitor (parquet committato, no registry) ----------------
  - name: gu_acts
    type: external
    repo: gu-monitor
    path: data/gu_acts.parquet

  # -- costituzione-italiana (GCS clean) ----------------------------
  - name: articoli_costituzione
    type: external
    repo: costituzione-italiana
    slug: articoli_costituzione
    layer: clean
    years: [2026]
  - name: revisioni_costituzionali
    type: external
    repo: costituzione-italiana
    slug: revisioni_costituzionali
    layer: clean
    years: [2026]
  - name: pronunce_corte_costituzionale
    type: external
    repo: costituzione-italiana
    slug: pronunce_corte_costituzionale
    layer: clean
    years: [2026]
  - name: massime_corte_costituzionale
    type: external
    repo: costituzione-italiana
    slug: massime_corte_costituzionale
    layer: clean
    years: [2026]
  - name: giudici_corte_costituzionale
    type: external
    repo: costituzione-italiana
    slug: giudici_corte_costituzionale
    layer: clean
    years: [2026]
  - name: atti_promovimento
    type: external
    repo: costituzione-italiana
    slug: atti_promovimento_corte_costituzionale
    layer: clean
    years: [2026]

  # -- senato-akn (GCS clean -- file grandi) -----------------------
  - name: senato_corpus
    type: external
    repo: senato-akn
    slug: senato_corpus
    layer: clean
    years: [2026]
  - name: senato_emendamenti
    type: external
    repo: senato-akn
    slug: senato_emendamenti
    layer: clean
    years: [2026]
  - name: senato_dibattito
    type: external
    repo: senato-akn
    slug: senato_dibattito
    layer: clean
    years: [2026]

  # -- open-politica multi-anno (legislature 13-19) ----------------
  # SQL usa {support.NAME.outputs} (lista URL) + union_by_name
  - name: senato_ddl
    type: external
    repo: open-politica
    slug: senato_ddl
    layer: clean
    years: [13, 14, 15, 16, 17, 18, 19]
  - name: camera_ddl
    type: external
    repo: open-politica
    slug: camera_ddl
    layer: clean
    years: [13, 14, 15, 16, 17, 18, 19]
  - name: camera_leggi
    type: external
    repo: open-politica
    slug: camera_leggi
    layer: clean
    years: [13, 14, 15, 16, 17, 18, 19]
  # -- open-politica ponti persona/atto (PR #41/#42) ---------------
  - name: senato_relatori
    type: external
    repo: open-politica
    slug: senato_relatori
    layer: clean
    years: [2026]
  - name: camera_firmatari
    type: external
    repo: open-politica
    slug: camera_firmatari
    layer: clean
    years: [13, 14, 15, 16, 17, 18, 19]
  # -- open-politica: votazioni Senato x DDL (PR #41) --------------
  - name: senato_votazioni_oggetto
    type: external
    repo: open-politica
    slug: senato_votazioni_oggetto
    layer: clean
    years: [2026]

  # -- costituzione-italiana: iter revisioni Cost. (PR #21) -------
  - name: iter_costituzionale
    type: external
    repo: costituzione-italiana
    slug: iter_costituzionale
    layer: clean
    years: [2026]

mart:
  # Ordine obbligato: le tabelle derivate leggono le precedenti
  # nella stessa sessione DuckDB del run MART.
  #   1 mart_legal_nodes / 2 mart_legal_edges  <- support esterni
  #   3+ metrics, search_keys, rel, emend_leg  <- FROM mart_legal_*
  tables:
    - name: "mart_legal_nodes"
      sql: "sql/mart_legal_nodes.sql"
    - name: "mart_legal_edges"
      sql: "sql/mart_legal_edges.sql"
    - name: "mart_legal_node_metrics"
      sql: "sql/mart_legal_node_metrics.sql"
    - name: "mart_legal_search_keys"
      sql: "sql/mart_legal_search_keys.sql"
    - name: "mart_legal_node_rel"
      sql: "sql/mart_legal_node_rel.sql"
    - name: "mart_legal_emend_leg"
      sql: "sql/mart_legal_emend_leg.sql"
    - name: "mart_legal_texts"
      sql: "sql/mart_legal_texts.sql"
    - name: "mart_legal_massime"
      sql: "sql/mart_legal_massime.sql"
  required_tables:
    - "mart_legal_nodes"
    - "mart_legal_edges"
    - "mart_legal_node_metrics"
    - "mart_legal_search_keys"
    - "mart_legal_texts"
  validate:
    table_rules:
      mart_legal_nodes:
        required_columns: [id, tipo, title, source, stato, materia]
        primary_key: [id]
        min_rows: 10000
      mart_legal_edges:
        required_columns: [source_id, relation, target_id, weight]
        min_rows: 10000
      mart_legal_node_metrics:
        required_columns: [id, referenced_by, impact_score]
        primary_key: [id]
        min_rows: 10000
      mart_legal_search_keys:
        required_columns: [id, title_folded, search_text, is_major]
        primary_key: [id]
        min_rows: 10000
      mart_legal_texts:
        required_columns: [id, kind, title, testo]
        primary_key: [id]
        min_rows: 1000
      mart_legal_massime:
        required_columns: [sentenza_id, ecli, id_massima, testo]
        min_rows: 10000

validation:
  fail_on_error: true
