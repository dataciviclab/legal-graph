# legal-graph — compose mart-only del Legal Knowledge Graph
#
# Modello pil-intelligence: nessun raw/clean propri. I SQL leggono i
# parquet upstream **direttamente da rete** (GCS HTTPS / GitHub raw)
# via support type: external — senza materializzarli in locale.
#
# Forma dichiarativa (toolkit PR dataciviclab/toolkit#497):
#   repo+slug+layer → path risolto dal registry del produttore
#   repo+path       → raw.githubusercontent.com (derived non nel registry)
#
# Output: out/data/mart/legal_graph/2026/
#   - mart_legal_nodes.parquet
#   - mart_legal_edges.parquet
#   - mart_legal_edges_in.parquet   (stessa tabella, ordinata per target_id)

root: "out"
schema_version: 1

dataset:
  name: "legal_graph"
  source_id: "dataciviclab_composite"
  tags: [diritto, normativa, legal-graph, compose, knowledge-graph]
  category: normativa
  description: >
    Legal Knowledge Graph: nodi unici e relazioni legislative/materiali
    unificati da italia-corpus, costituzione-italiana, gu-monitor,
    senato-akn e open-politica. Fonti lette da rete (GCS/GitHub).
  years: [2026]
  time_coverage:
    start_year: 1874
    end_year: 2026

# Nessuna sezione raw/clean: mart-only compose.

support:
  # -- italia-corpus (clean GCS -- layer toolkit IC) ----------------
  - name: normativa
    type: external
    repo: italia-corpus
    slug: normativa
    layer: clean
    years: [2026]
  # Testo degli atti (una riga per espressione): alimenta l'indice
  # lessicale `mart_legal_search_terms` e, in futuro, `legal_text`
  # senza GitHub raw. Stesso artifact del dataset IC `testi`.
  - name: testi
    type: external
    repo: italia-corpus
    slug: testi
    layer: clean
    years: [2026]
  # `riferimenti` clean non è più un support: i nodi catalogo usano il mart
  # URN (stessa sorgente degli edge `riferimento`), così i due non divergono.
  # Contratto URN-based (fonte_urn, bersaglio_urn, rel_type, peso, ...):
  # edges_riferimenti e edges_abro fanno join esatto sui nodi, senza
  # normalizzazione URN nel compose.
  - name: riferimenti_urn
    type: external
    repo: italia-corpus
    slug: riferimenti
    layer: mart
    table: mart_riferimenti_urn
    years: [2026]
  # Direttive UE citate: identità CELEX + misure nazionali (italia-corpus).
  # Nodi `celex:*`; le due grafie URN di Normattiva collassano sullo stesso nodo.
  - name: direttive_ue
    type: external
    repo: italia-corpus
    slug: direttive_ue
    layer: clean
    years: [2026]
  # Citazioni costituzionali: archi `origine='costituzione'` nel clean di
  # `riferimenti` (fold 2026-11). Il target non è un atto: `bersaglio_id`
  # porta `costituzione:art:N`, `bersaglio_urn` è vuota.
  - name: riferimenti_clean
    type: external
    repo: italia-corpus
    slug: riferimenti
    layer: clean
    years: [2026]
  # repeal/substitution AKN (URN→URN); le abroga regex arrivano dal mart
  # riferimenti_urn, non più da un parquet derivato (2026-11)
  - name: akn_relations
    type: external
    repo: italia-corpus
    slug: akn_relations
    layer: clean
    years: [2026]
  # EIV (entrata in vigore effettiva) per colonne nodi
  - name: akn_act_meta
    type: external
    repo: italia-corpus
    slug: akn_act_meta
    layer: clean
    years: [2026]

  # -- gu-monitor (clean su GCS, via registry) -----------------------
  - name: gu_acts
    type: external
    repo: gu-monitor
    slug: gu_atti
    layer: clean
    years: [2026]

  # -- costituzione-italiana (GCS clean) ----------------------------
  - name: articoli_costituzione
    type: external
    repo: costituzione-italiana
    slug: articoli_costituzione
    layer: clean
    years: [2026]
  - name: revisioni_costituzionali
    type: external
    repo: costituzione-italiana
    slug: revisioni_costituzionali
    layer: clean
    years: [2026]
  - name: pronunce_corte_costituzionale
    type: external
    repo: costituzione-italiana
    slug: pronunce_corte_costituzionale
    layer: clean
    years: [2026]
  - name: massime_corte_costituzionale
    type: external
    repo: costituzione-italiana
    slug: massime_corte_costituzionale
    layer: clean
    years: [2026]
  # Massime: il clean è una riga per massima con `parametri`/`norme` in JSON.
  # Gli edge leggono i mart esplosi (una riga per massima×parametro/norma):
  # niente prodotto cartesiano tra le due liste.
  - name: massime_parametri
    type: external
    repo: costituzione-italiana
    slug: massime_corte_costituzionale
    layer: mart
    table: mart_massime_parametri
    years: [2026]
  - name: massime_norme
    type: external
    repo: costituzione-italiana
    slug: massime_corte_costituzionale
    layer: mart
    table: mart_massime_norme
    years: [2026]
  - name: giudici_corte_costituzionale
    type: external
    repo: costituzione-italiana
    slug: giudici_corte_costituzionale
    layer: clean
    years: [2026]
  - name: atti_promovimento
    type: external
    repo: costituzione-italiana
    slug: atti_promovimento_corte_costituzionale
    layer: clean
    years: [2026]
  # Atti fetchati singolarmente via Normattiva API (dettaglio-atto-urn).
  # Leggi ordinarie non in collezioni ZIP. Produce nodi con vigenza reale.
  # Generato da: python -m lab_tools.fetch_urn_acts (italia-corpus)
  - name: atti_api
    type: external
    repo: italia-corpus
    slug: atti_api
    layer: clean
    years: [2026]
  # Catalogo ufficiale Normattiva (~205k atti): serve ai nodi "catalogo" per
  # gli atti citati che non sono nelle collezioni. Solo metadati, nessun testo.
  - name: atti_index
    type: external
    repo: italia-corpus
    slug: atti_index
    layer: clean
    years: [2026]

  # -- senato-akn (GCS clean -- file grandi) -----------------------
  - name: senato_corpus
    type: external
    repo: senato-akn
    slug: senato_corpus
    layer: clean
    years: [2026]
  - name: senato_emendamenti
    type: external
    repo: senato-akn
    slug: senato_emendamenti
    layer: clean
    years: [2026]
  - name: senato_dibattito
    type: external
    repo: senato-akn
    slug: senato_dibattito
    layer: clean
    years: [2026]

  # -- open-politica: dimensione persona (Camera + Senato, Repubblica 13-19)
  # Un nodo per persona: identità unica e ponte Camera↔Senato.
  # ⚠️ richiede il registry di open-politica aggiornato (merge di #117).
  - name: persone
    type: external
    repo: open-politica
    slug: persone
    layer: mart
    table: mart_persone
    years: [2026]
  # -- open-politica: dimensione atto conformata (Camera + Senato) ------
  # Chiave canonica `atto_id`: senato:{id_ddl} · camera:{legislatura}:{id_ddl}.
  # L'id_ddl Camera si ripete tra legislature (6.328 valori su 7.614): senza
  # la legislatura 34.315 atti collassano su 7.614 nodi.
  # Due support puntano allo stesso dataset `atti` (3 mart): la forma
  # repo+slug+layer=mart richiede `table:` quando i mart sono più di uno.
  # ⚠️ Con `table:` esplicito il toolkit NON valida lo slug nel registry del
  # produttore: se `atti` non è ancora registrato costruisce in silenzio
  # https://…/mart/atti/{year}/… (senza il prefisso `open-politica/`).
  # Per questo il merge va dopo open-politica (che aggiorna il registry).
  - name: atti
    type: external
    repo: open-politica
    slug: atti
    layer: mart
    table: mart_atti
    years: [2026]
  # decreti-legge: esito + tempi di conversione (assorbe compose/decreti-legge)
  - name: dl
    type: external
    repo: open-politica
    slug: atti
    layer: mart
    table: mart_dl
    years: [2026]
  # -- open-politica multi-anno (legislature 13-19) ----------------
  # SQL usa {support.NAME.outputs} (lista URL) + union_by_name
  - name: senato_ddl
    type: external
    repo: open-politica
    slug: senato_ddl
    layer: clean
    years: [13, 14, 15, 16, 17, 18, 19]
  # camera_ddl non è più un support: i nodi Camera arrivano da `atti`
  # (chiave `camera:{legislatura}:{id_ddl}`). Il label pubblicato
  # `source = 'camera_ddl'` resta invariato per i consumer.
  - name: camera_leggi
    type: external
    repo: open-politica
    slug: camera_leggi
    layer: clean
    years: [13, 14, 15, 16, 17, 18, 19]
  # -- open-politica ponti persona/atto (PR #41/#42) ---------------
  - name: senato_relatori
    type: external
    repo: open-politica
    slug: senato_relatori
    layer: clean
    years: [2026]
  - name: senato_firmatari
    type: external
    repo: open-politica
    slug: senato_firmatari
    layer: clean
    years: [2026]
  - name: camera_firmatari
    type: external
    repo: open-politica
    slug: camera_firmatari
    layer: clean
    years: [13, 14, 15, 16, 17, 18, 19]
  # -- open-politica: anagrafica deputati (tutte le legislature) -----
  - name: camera_deputati_legislature
    type: external
    repo: open-politica
    slug: camera_deputati_legislature
    layer: clean
    years: [2026]
  # -- open-politica: ponte senatore↔persona (issue #20) -----------
  - name: ponte_persona
    type: external
    repo: open-politica
    slug: ponte_persona
    layer: clean
    years: [2026]
  # -- open-politica: anagrafica senatori Leg 13-19 (issue #24) ----
  # `senato_anagrafica` non è più un support: identità e nomi arrivano
  # da `persone` (una sola sorgente per le persone).
  # -- open-politica: votazioni Senato x DDL (PR #41) --------------
  - name: senato_votazioni_oggetto
    type: external
    repo: open-politica
    slug: senato_votazioni_oggetto
    layer: clean
    years: [2026]
  # -- open-politica: relatori Camera con chiave atto (OP #62) ----
  - name: camera_relatori
    type: external
    repo: open-politica
    slug: camera_relatori
    layer: clean
    years: [16, 17, 18, 19]
  # -- open-politica: DL identificati da `atti` (dl_numero/dl_anno) -----
  # (compose/decreti-legge assorbito in open-politica `atti`, 2026-11)

  # -- costituzione-italiana: iter revisioni Cost. (PR #21) -------
  - name: iter_costituzionale
    type: external
    repo: costituzione-italiana
    slug: iter_costituzionale
    layer: clean
    years: [2026]

mart:
  # Ordine obbligato: le tabelle derivate leggono le precedenti
  # nella stessa sessione DuckDB del run MART.
  #   1 mart_legal_nodes / 2 mart_legal_edges  <- support esterni
  #   3+ metrics, search_keys, rel, emend_leg  <- FROM mart_legal_*
  tables:
    - name: "mart_legal_nodes"
      sql: "sql/mart_legal_nodes.sql"
    - name: "mart_legal_edges"
      sql: "sql/mart_legal_edges.sql"
    # alias di identità (camera:atto, dl, norma) e vocabolario relazioni:
    # contratti letti dalle view MCP, non liste hardcoded nei consumer
    - name: "mart_legal_entity_alias"
      sql: "sql/mart_legal_entity_alias.sql"
    - name: "mart_legal_relation_type"
      sql: "sql/mart_legal_relation_type.sql"
    # stessa tabella degli archi ordinata per target_id: query "in entrata"
    - name: "mart_legal_edges_in"
      sql: "sql/mart_legal_edges_in.sql"
    - name: "mart_legal_coverage"
      sql: "sql/mart_legal_coverage.sql"
    - name: "mart_legal_node_metrics"
      sql: "sql/mart_legal_node_metrics.sql"
    - name: "mart_legal_search_keys"
      sql: "sql/mart_legal_search_keys.sql"
    # indice lessicale full-text (BM25) sugli atti: la ricerca per tema
    # legge qui invece di fare LIKE sul titolo
    - name: "mart_legal_search_terms"
      sql: "sql/mart_legal_search_terms.sql"
    - name: "mart_legal_node_rel"
      sql: "sql/mart_legal_node_rel.sql"
    - name: "mart_legal_emend_leg"
      sql: "sql/mart_legal_emend_leg.sql"
    - name: "mart_legal_texts"
      sql: "sql/mart_legal_texts.sql"
    - name: "mart_legal_massime"
      sql: "sql/mart_legal_massime.sql"
  required_tables:
    - "mart_legal_nodes"
    - "mart_legal_edges"
    - "mart_legal_entity_alias"
    - "mart_legal_relation_type"
    - "mart_legal_node_metrics"
    - "mart_legal_search_keys"
    - "mart_legal_search_terms"
    - "mart_legal_texts"
  validate:
    table_rules:
      mart_legal_nodes:
        required_columns: [id, tipo, title, source, stato, materia]
        primary_key: [id]
        min_rows: 10000
      mart_legal_edges:
        required_columns: [source_id, relation, target_id, weight]
        min_rows: 10000
      mart_legal_edges_in:
        required_columns: [source_id, relation, target_id, weight]
        min_rows: 10000
      mart_legal_entity_alias:
        required_columns: [alias_id, entity_id, alias_type]
        primary_key: [alias_id]
        min_rows: 1000
      mart_legal_relation_type:
        required_columns: [relation, family, in_impact, canonical_relation]
        primary_key: [relation]
        min_rows: 20
      mart_legal_coverage:
        required_columns: [relation, upstream_rows, natural_pairs, edges, edge_pct]
        primary_key: [relation]
        min_rows: 10
      mart_legal_node_metrics:
        required_columns: [id, referenced_by, impact_score]
        primary_key: [id]
        min_rows: 10000
      mart_legal_search_keys:
        required_columns: [id, title_folded]
        primary_key: [id]
        min_rows: 10000
      mart_legal_search_terms:
        required_columns: [id, term, weight]
        primary_key: [id, term]
        min_rows: 1000000
      mart_legal_texts:
        required_columns: [id, kind, title, testo]
        primary_key: [id]
        min_rows: 1000
      mart_legal_massime:
        required_columns: [sentenza_id, ecli, id_massima, testo]
        min_rows: 10000

validation:
  fail_on_error: true
